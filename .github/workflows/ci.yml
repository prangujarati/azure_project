name: Deploy to Databricks

on:
  workflow_dispatch:
    inputs:
      environment_choice:
        description: 'Choose environment (or "All" for all environments)'
        required: true
        default: 'Development'
        type: choice
        options:
          - Development
          - Testing
          - Staging
          - Production
          - All

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ contains(inputs.environment_choice, 'All') && ['Development', 'Testing', 'Staging', 'Production'] || [inputs.environment_choice] }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build wheel package
        run: |
          pip install wheel
          python setup.py bdist_wheel

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          echo "Deploying to ${{ matrix.environment }} environment"
          
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::error::DATABRICKS_HOST is not set"
            exit 1
          fi
          
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::DATABRICKS_TOKEN_ST_MP is not set"
            exit 1
          fi

      - name: Upload to Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          databricks fs cp --overwrite dist/*.whl "dbfs:/FileStore/packages/Assign/"
          echo "Successfully deployed to ${{ matrix.environment }}"
