name: Deploy to Databricks

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Enter environment name: Development or Testing'
        required: true
        default: "['Development','Testing']"
        type: string

jobs:
  upload-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Validate environment input
        id: validate_env
        run: |
          # Extract and validate environment from input
          ENV_INPUT="${{ github.event.inputs.target_environment }}"
          if [[ "$ENV_INPUT" == *'"Development"'* ]]; then
            echo "Using Development environment"
            echo "SELECTED_ENV=Development" >> $GITHUB_OUTPUT
          elif [[ "$ENV_INPUT" == *'"Testing"'* ]]; then
            echo "Using Testing environment"
            echo "SELECTED_ENV=Testing" >> $GITHUB_OUTPUT
          else
            echo "::error::Input must contain either 'Development' or 'Testing'"
            echo "::error::Received input: '$ENV_INPUT'"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies and build wheel
        run: |
          pip install wheel
          python setup.py bdist_wheel

      - name: List contents of dist folder
        run: |
          echo "Listing contents of dist/"
          ls -l dist || echo "dist/ not found"

      - name: Install Databricks CLI
        run: |
          pip install 'databricks-cli<1.0.0'

      - name: Verify Databricks credentials
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          # Validate credentials are set (without exposing values)
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::error::DATABRICKS_HOST secret is not configured"
            exit 1
          fi
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::DATABRICKS_TOKEN_ST_MP secret is not configured"
            exit 1
          fi
          echo "Credentials validation passed"

      - name: Test Databricks connection
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          echo "Testing connection to Databricks workspace..."
          if ! databricks --version; then
            echo "::error::Failed to connect to Databricks"
            exit 1
          fi
          echo "Connection successful"

      - name: Upload wheel to DBFS
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          WHL_PATH=$(ls dist/*.whl 2>/dev/null || echo "")
          if [ -z "$WHL_PATH" ]; then
            echo "❌ No .whl file found to upload"
            exit 1
          fi
          echo "Uploading $WHL_PATH to DBFS..."
          if ! databricks fs cp --overwrite "$WHL_PATH" "dbfs:/FileStore/packages/Assign/"; then
            echo "::error::Failed to upload wheel file"
            exit 1
          fi
          echo "✅ Upload successful"

      - name: Verify uploaded file
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          WHL_FILE=$(basename $(ls dist/*.whl))
          echo "Verifying $WHL_FILE in DBFS..."
          if ! databricks fs ls "dbfs:/FileStore/packages/Assign/$WHL_FILE"; then
            echo "::error::Upload verification failed"
            exit 1
          fi
          echo "✅ Verification passed"
