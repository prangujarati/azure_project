name: Deploy to Databricks

on:
  workflow_dispatch:
    inputs:
      environments_to_use:
        description: 'Available environments (e.g., "Development" or ["Development","Testing"])'
        required: true
        default: '["Development","Testing","Staging","Production"]'
        type: string

jobs:
  upload-wheel:
    runs-on: ubuntu-latest
    
    # Environment context removed since it was causing issues
    # secrets: inherit removed since it conflicts with runs-on
    
    steps:
      - name: Parse environment input
        id: parse_env
        run: |
          # Handles both direct input and default array
          ENV_INPUT="${{ inputs.environments_to_use || '["Development","Testing","Staging","Production"]' }}"
          
          # Extract first valid environment (supports both formats)
          if [[ "$ENV_INPUT" =~ \"Development\" ]]; then
            echo "SELECTED_ENV=Development" >> $GITHUB_OUTPUT
          elif [[ "$ENV_INPUT" =~ \"Testing\" ]]; then
            echo "SELECTED_ENV=Testing" >> $GITHUB_OUTPUT
          elif [[ "$ENV_INPUT" =~ \"Staging\" ]]; then
            echo "SELECTED_ENV=Staging" >> $GITHUB_OUTPUT
          elif [[ "$ENV_INPUT" =~ \"Production\" ]]; then
            echo "SELECTED_ENV=Production" >> $GITHUB_OUTPUT
          else
            echo "::error::No valid environment found in: $ENV_INPUT"
            exit 1
          fi
          echo "Using environment: $SELECTED_ENV"

      - name: Configure Databricks CLI
        env:
          # Explicit secret references (since we can't use secrets: inherit)
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::error::DATABRICKS_HOST not found. Verify:"
            echo "::error::1. Secret exists in repository settings"
            echo "::error::2. Workflow has correct permissions"
            exit 1
          fi
          echo "Successfully configured Databricks CLI"

      - name: Upload wheel package
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          databricks fs cp --overwrite dist/*.whl "dbfs:/FileStore/packages/Assign/"
          echo "Upload completed successfully"
