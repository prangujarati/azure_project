name: Deploy to Databricks

on:
  workflow_dispatch:
    inputs:
      environments_to_use:
        description: 'Enter environment (e.g., "Development" or ["Development","Testing"])'
        required: true
        default: '["Development","Testing","Staging","Production"]'
        type: string

jobs:
  upload-wheel:
    runs-on: ubuntu-latest
    
    steps:
      - name: Parse environment input
        id: parse_env
        run: |
          # Handle both direct input and array format
          ENV_INPUT="${{ inputs.environments_to_use || '["Development","Testing","Staging","Production"]' }}"
          
          # Check for direct environment name first
          if [[ "$ENV_INPUT" == "Development" || "$ENV_INPUT" == "Testing" || 
                "$ENV_INPUT" == "Staging" || "$ENV_INPUT" == "Production" ]]; then
            echo "SELECTED_ENV=$ENV_INPUT" >> $GITHUB_OUTPUT
          # Check for array format
          elif [[ "$ENV_INPUT" =~ \"Development\" ]]; then
            echo "SELECTED_ENV=Development" >> $GITHUB_OUTPUT
          elif [[ "$ENV_INPUT" =~ \"Testing\" ]]; then
            echo "SELECTED_ENV=Testing" >> $GITHUB_OUTPUT
          elif [[ "$ENV_INPUT" =~ \"Staging\" ]]; then
            echo "SELECTED_ENV=Staging" >> $GITHUB_OUTPUT
          elif [[ "$ENV_INPUT" =~ \"Production\" ]]; then
            echo "SELECTED_ENV=Production" >> $GITHUB_OUTPUT
          else
            echo "::error::Invalid environment input: $ENV_INPUT"
            echo "::error::Must be one of: Development, Testing, Staging, Production"
            exit 1
          fi
          
          echo "Using environment: $SELECTED_ENV"

      - name: Configure Databricks CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::error::DATABRICKS_HOST secret not found"
            exit 1
          fi
          echo "Successfully configured Databricks CLI"

      - name: Upload wheel package
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          databricks fs cp --overwrite dist/*.whl "dbfs:/FileStore/packages/Assign/"
          echo "Upload completed successfully"
