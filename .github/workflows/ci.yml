name: Deploy to Databricks

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Enter environment name: Development or Testing'
        required: true
        default: 'Development'
        type: string

jobs:
  upload-wheel:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies and build wheel
        run: |
          pip install wheel
          python setup.py bdist_wheel

      - name: List contents of dist folder
        run: |
          echo "Listing contents of dist/"
          ls -l dist || echo "dist/ not found"

      - name: Install Databricks CLI
        run: |
          pip install 'databricks-cli<1.0.0'

      - name: Configure CLI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          echo "Running databricks version "
          databricks --version
