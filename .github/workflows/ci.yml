name: Deploy to Databricks

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Enter environment name: Development or Testing'
        required: true
        default: "['Development','Testing']"
        type: string

jobs:
  upload-wheel:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools

      - name: Build wheel package
        run: |
          python setup.py bdist_wheel
          echo "Wheel built successfully"
          
      - name: Verify wheel file
        run: |
          echo "Generated wheel files:"
          ls -l dist/*.whl || echo "No wheel files found"
          if [ ! -f dist/*.whl ]; then
            echo "::error::No wheel file found in dist/"
            exit 1
          fi

      - name: Install Databricks CLI
        run: |
          pip install 'databricks-cli<1.0.0'
          echo "Installed databricks-cli version:"
          databricks --version

      - name: Upload wheel to DBFS
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          WHL_FILE=$(ls dist/*.whl)
          echo "Uploading $WHL_FILE to DBFS..."
          
          if ! databricks fs cp --overwrite "$WHL_FILE" "dbfs:/FileStore/packages/Assign/"; then
            echo "::error::Failed to upload wheel file"
            exit 1
          fi
          
          echo "Upload successful"
          echo "File location: dbfs:/FileStore/packages/Assign/$(basename $WHL_FILE)"

      - name: Verify uploaded file
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          WHL_FILE=$(basename $(ls dist/*.whl))
          echo "Verifying uploaded file: $WHL_FILE"
          
          if ! databricks fs ls "dbfs:/FileStore/packages/Assign/$WHL_FILE"; then
            echo "::error::Upload verification failed - file not found"
            exit 1
          fi
          
          echo "Verification successful"
