name: Deploy to Databricks

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Enter environment name: Development or Testing'
        required: true
        default: "['Development','Testing']"  # ← Keeps your exact format
        type: string

jobs:
  upload-wheel:
    runs-on: ubuntu-latest
    # REMOVED the environment: line completely ← Key fix

    steps:
      - name: Parse environment input
        id: parse_env
        run: |
          # Handles both formats: "Development" and "['Development','Testing']"
          ENV_INPUT="${{ github.event.inputs.target_environment }}"
          if [[ "$ENV_INPUT" == *Development* ]]; then
            echo "SELECTED_ENV=Development" >> $GITHUB_OUTPUT
          elif [[ "$ENV_INPUT" == *Testing* ]]; then
            echo "SELECTED_ENV=Testing" >> $GITHUB_OUTPUT
          else
            echo "::error::Must specify 'Development' or 'Testing'"
            exit 1
          fi

      - name: Configure Databricks CLI
        env:
          # Uses your original secret names directly
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::error::DATABRICKS_HOST is not set"
            exit 1
          fi
          echo "Databricks host configured"

      # Rest of your workflow steps...
      - name: Upload wheel
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_ST_MP }}
        run: |
          databricks fs cp --overwrite dist/*.whl "dbfs:/FileStore/packages/Assign/"
